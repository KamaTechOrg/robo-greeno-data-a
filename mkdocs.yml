site_name: Robo-Greeno — Physical AI Tutorial
site_url: https://kamatechorg.github.io/robo-greeno-data-a/
site_description: >-
  An intuitive Physical AI tutorial: LLMs vs robots, why nature builds
  legs the way it does, MuJoCo simulation, and reinforcement learning —
  taught through a six-legged agricultural spider robot.
repo_url: https://github.com/KamaTechOrg/robo-greeno-data-a
repo_name: KamaTechOrg/robo-greeno-data-a

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Physical AI Tutorial:
      - Overview: tutorial/index.md
      - 1. LLM AI vs Physical AI: tutorial/01-llm-vs-physical-ai.md
      - 2. Legs and Fingers — Nature's Engineering: tutorial/02-legs-and-fingers.md
      - 3. MuJoCo Without Tears: tutorial/03-mujoco-intuition.md
      - 4. Reinforcement Learning, Intuitively: tutorial/04-rl-intuition.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

# Material auto-generates sitemap.xml; site_description + per-page
# front-matter "description:" become <meta name="description"> tags.
